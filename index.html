    <!-- Google tag (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      (function () {
        var granted = false;
        try { granted = localStorage.getItem("certchamps-analytics-consent") === "granted"; } catch (e) {}
        gtag("consent", "default", {
          analytics_storage: granted ? "granted" : "denied",
          ad_storage: "denied",
          ad_user_data: "denied",
          ad_personalization: "denied"
        });
        gtag("js", new Date());
        if (granted) {
          var debug = location.hostname === "localhost" || location.hostname === "127.0.0.1";
          gtag("config", "G-T9KRDYV6J", { anonymize_ip: true, debug_mode: debug });
        }
      })();
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T9KRDYV6J"></script>

  <body>
    <div id="root"><p></p></div>
       <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
    <script type="module" src="/src/main.tsx"></script>
    <!-- Captcha Importing -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  </body>
